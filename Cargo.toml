[package]
name = "kotoba"
version = "0.1.0"
edition = "2024"
description = "Immersive Japanese language learning CLI with SRS and TTS"
license = "MIT"
repository = "https://github.com/rararulab/kotoba"

[dependencies]
async-trait = "0.1"
bon = "3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
config = "0.15"
dirs = "6"
futures-util = "0.3"
indicatif = "0.17"
reqwest = { version = "0.13", features = ["json", "multipart", "query", "stream"] }
rodio = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
snafu = "0.9"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
axum = { version = "0.8", features = ["ws"] }
tempfile = "3"
toml = "0.8"
zip = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

ort = { version = "2.0.0-rc.12", features = ["ndarray"] }
ndarray = "0.17"
ndarray-npy = "0.10"
wana_kana = "4.0.0"

[dev-dependencies]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
redundant_pub_crate = "allow"
