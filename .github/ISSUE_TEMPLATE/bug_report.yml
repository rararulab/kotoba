name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the system is affected?
      options:
        - cli (command-line interface)
        - srs (spaced repetition system)
        - tts (text-to-speech, VOICEVOX)
        - db (database, storage)
        - config (configuration)
        - ci (CI/CD, build, release)
        - other
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue
      placeholder: |
        1. Run `kotoba add ...`
        2. Run `kotoba review`
        3. Observe error ...

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error output
      description: Relevant log output or error messages
      render: shell

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `kotoba --version`
      placeholder: "kotoba 0.1.0"
