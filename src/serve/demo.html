<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kotoba — voice</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #14141f;
    --surface-2: #1e1e2e;
    --border: #2a2a3a;
    --text: #e6e8f0;
    --muted: #6b6b80;
    --accent: #7c5cff;
    --accent-glow: rgba(124, 92, 255, 0.35);
    --danger: #ef4444;
    --success: #10b981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  .app {
    display: flex; flex-direction: column;
    height: 100vh; max-width: 520px; margin: 0 auto;
    padding: 0 16px;
  }

  /* ---- Header ---- */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 0 8px;
    flex-shrink: 0;
  }
  .header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
  .settings-btn {
    background: none; border: 1px solid var(--border); border-radius: 8px;
    color: var(--muted); font-size: 13px; padding: 6px 12px; cursor: pointer;
  }
  .settings-btn:hover { border-color: var(--accent); color: var(--text); }

  /* ---- Orb ---- */
  .orb-container {
    display: flex; align-items: center; justify-content: center;
    padding: 32px 0 24px;
    flex-shrink: 0;
  }
  .orb {
    width: 120px; height: 120px; border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #3a3a5c, #1a1a2e);
    box-shadow: 0 0 0 0 var(--accent-glow);
    transition: box-shadow 0.4s, background 0.4s, transform 0.3s;
    position: relative;
  }
  .orb.recording {
    background: radial-gradient(circle at 40% 40%, #2d5a3d, #1a2e1a);
    box-shadow: 0 0 40px 10px rgba(16, 185, 129, 0.3);
    animation: orb-pulse 1.5s ease-in-out infinite;
  }
  .orb.generating {
    background: radial-gradient(circle at 40% 40%, #4a3a6c, #2a1a4e);
    box-shadow: 0 0 50px 15px var(--accent-glow);
    animation: orb-spin 2s linear infinite;
  }
  @keyframes orb-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  @keyframes orb-spin {
    0% { box-shadow: 0 0 50px 15px var(--accent-glow); }
    50% { box-shadow: 0 0 70px 20px rgba(124, 92, 255, 0.45); }
    100% { box-shadow: 0 0 50px 15px var(--accent-glow); }
  }
  .orb-label {
    text-align: center; font-size: 13px; color: var(--muted);
    margin-top: 12px;
  }

  /* ---- Conversation ---- */
  .conversation {
    flex: 1; overflow-y: auto;
    padding: 8px 0;
    display: flex; flex-direction: column; gap: 10px;
    min-height: 0;
  }
  .conversation::-webkit-scrollbar { width: 4px; }
  .conversation::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg {
    max-width: 85%; padding: 10px 14px;
    border-radius: 14px; font-size: 14px; line-height: 1.5;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent); color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--surface-2); color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .msg.partial {
    opacity: 0.7; border: 1px dashed var(--border);
    background: transparent;
  }
  .msg.error-msg {
    align-self: center; color: var(--danger);
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid var(--danger); font-size: 12px;
    border-radius: 8px;
  }

  /* ---- Controls ---- */
  .controls {
    display: flex; justify-content: center; gap: 16px;
    padding: 16px 0 24px;
    flex-shrink: 0;
  }
  .ctrl-btn {
    width: 64px; height: 64px; border-radius: 50%; border: none;
    cursor: pointer; font-size: 24px; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .ctrl-btn.mic {
    background: var(--accent); color: white;
  }
  .ctrl-btn.mic:hover { transform: scale(1.08); }
  .ctrl-btn.mic.active {
    background: var(--danger); animation: mic-pulse 1.2s infinite;
  }
  @keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
    50% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
  }
  .ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

  /* ---- Settings modal ---- */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.6); z-index: 100;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px; width: 90%; max-width: 420px;
    max-height: 80vh; overflow-y: auto;
  }
  .modal h2 { font-size: 16px; margin-bottom: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select, .field textarea {
    width: 100%; font-family: inherit; font-size: 13px;
    color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; outline: none;
  }
  .field textarea { resize: vertical; min-height: 60px; line-height: 1.4; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .modal-actions button {
    flex: 1; padding: 10px; border: none; border-radius: 8px;
    font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .btn-save { background: var(--accent); color: white; }
  .btn-cancel { background: var(--surface-2); color: var(--muted); }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>kotoba voice</h1>
    <button class="settings-btn" id="settings-btn">Settings</button>
  </div>

  <div class="orb-container">
    <div>
      <div class="orb" id="orb"></div>
      <div class="orb-label" id="orb-label">tap to start</div>
    </div>
  </div>

  <div class="conversation" id="conversation"></div>

  <div class="controls">
    <button class="ctrl-btn mic" id="mic-btn" title="Hold to talk / tap to toggle">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
  </div>
</div>

<!-- Settings modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2>Settings</h2>
    <div class="field">
      <label>ASR URL</label>
      <input type="text" id="s-asr-url" placeholder="http://localhost:8000/v1/audio/transcriptions">
    </div>
    <div class="field">
      <label>LLM URL</label>
      <input type="text" id="s-llm-url" placeholder="http://localhost:11434/v1">
    </div>
    <div class="field">
      <label>LLM API Key</label>
      <input type="password" id="s-llm-key" placeholder="sk-... (optional)">
    </div>
    <div class="field">
      <label>LLM Model</label>
      <input type="text" id="s-llm-model" placeholder="qwen2.5:7b">
    </div>
    <div class="field">
      <label>Voice</label>
      <select id="s-voice"><option value="kokoro:jf_alpha">kokoro:jf_alpha (default)</option></select>
    </div>
    <div class="field">
      <label>System Prompt</label>
      <textarea id="s-system-prompt" rows="3"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="modal-cancel">Cancel</button>
      <button class="btn-save" id="modal-save">Save</button>
    </div>
  </div>
</div>

<script>
// ============================================================================
// kotoba voice — mlx-live-style real-time voice conversation
//
// Pipeline: browser mic (AudioWorklet PCM) -> WS /ws/voice (server-side
// VAD + ASR + LLM + TTS) -> float32 PCM playback via AudioContext.
// ============================================================================

const STORAGE_PREFIX = 'kotoba.voice.';
const DEFAULTS = {
  asrUrl: 'http://localhost:8000/v1/audio/transcriptions',
  llmUrl: 'http://localhost:11434/v1',
  llmKey: '',
  llmModel: 'qwen2.5:7b',
  voice: 'kokoro:jf_alpha',
  systemPrompt: 'You are a friendly conversation partner. Reply in the same language as the user, and keep responses short and natural.',
};

function loadSettings() {
  const s = {};
  for (const [k, v] of Object.entries(DEFAULTS)) {
    s[k] = localStorage.getItem(STORAGE_PREFIX + k) || v;
  }
  return s;
}
function saveSettings(s) {
  for (const [k, v] of Object.entries(s)) {
    localStorage.setItem(STORAGE_PREFIX + k, v);
  }
}

let settings = loadSettings();

// Populate voice dropdown from /v1/voices on page load.
(async function loadVoices() {
  const sel = document.getElementById('s-voice');
  try {
    const r = await fetch('/v1/voices');
    const data = await r.json();
    if (data.voices && data.voices.length > 0) {
      sel.innerHTML = '';
      for (const v of data.voices) {
        const opt = document.createElement('option');
        opt.value = v.id;
        opt.textContent = `${v.id} — ${v.name}`;
        if (v.id === settings.voice) opt.selected = true;
        sel.appendChild(opt);
      }
    }
  } catch (_) { /* keep default option */ }
})();

// DOM refs
const orbEl = document.getElementById('orb');
const orbLabel = document.getElementById('orb-label');
const convEl = document.getElementById('conversation');
const micBtn = document.getElementById('mic-btn');
const settingsBtn = document.getElementById('settings-btn');
const modalOverlay = document.getElementById('modal-overlay');

// State
let ws = null;
let audioCtx = null;
let mediaStream = null;
let workletNode = null;
let isConnected = false;
let playbackQueue = [];
let isPlaying = false;
let nextPlayTime = 0;
let outputSampleRate = 24000;

// ---- Settings modal ----
settingsBtn.onclick = () => {
  document.getElementById('s-asr-url').value = settings.asrUrl;
  document.getElementById('s-llm-url').value = settings.llmUrl;
  document.getElementById('s-llm-key').value = settings.llmKey;
  document.getElementById('s-llm-model').value = settings.llmModel;
  document.getElementById('s-voice').value = settings.voice;
  document.getElementById('s-system-prompt').value = settings.systemPrompt;
  modalOverlay.classList.add('open');
};
document.getElementById('modal-cancel').onclick = () => {
  modalOverlay.classList.remove('open');
};
document.getElementById('modal-save').onclick = () => {
  settings = {
    asrUrl: document.getElementById('s-asr-url').value || DEFAULTS.asrUrl,
    llmUrl: document.getElementById('s-llm-url').value || DEFAULTS.llmUrl,
    llmKey: document.getElementById('s-llm-key').value,
    llmModel: document.getElementById('s-llm-model').value || DEFAULTS.llmModel,
    voice: document.getElementById('s-voice').value || DEFAULTS.voice,
    systemPrompt: document.getElementById('s-system-prompt').value || DEFAULTS.systemPrompt,
  };
  saveSettings(settings);
  modalOverlay.classList.remove('open');
  // Reconnect with new settings if active.
  if (isConnected) { disconnect(); connect(); }
};

// ---- Orb state ----
function setPhase(phase) {
  orbEl.className = 'orb';
  if (phase === 'recording' || phase === 'idle') {
    // When connected, the mic is always live — show recording state.
    if (isConnected) {
      orbEl.classList.add('recording');
      orbLabel.textContent = 'listening...';
    } else {
      orbLabel.textContent = 'tap to start';
    }
  } else if (phase === 'generating') {
    orbEl.classList.add('generating');
    orbLabel.textContent = 'thinking...';
  }
}

// ---- Conversation UI ----
let partialEl = null;

function addMessage(role, text) {
  // Remove partial if it exists.
  removePartial();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  convEl.appendChild(div);
  convEl.scrollTop = convEl.scrollHeight;
}

function addError(text) {
  const div = document.createElement('div');
  div.className = 'msg error-msg';
  div.textContent = text;
  convEl.appendChild(div);
  convEl.scrollTop = convEl.scrollHeight;
}

function updatePartial(text) {
  if (!partialEl) {
    partialEl = document.createElement('div');
    partialEl.className = 'msg assistant partial';
    convEl.appendChild(partialEl);
  }
  partialEl.textContent = text;
  convEl.scrollTop = convEl.scrollHeight;
}

function removePartial() {
  if (partialEl) {
    partialEl.remove();
    partialEl = null;
  }
}

// ---- Audio playback ----
function ensureAudioCtx() {
  if (!audioCtx) {
    audioCtx = new AudioContext();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function queueAudio(float32Samples) {
  ensureAudioCtx();
  const buffer = audioCtx.createBuffer(1, float32Samples.length, outputSampleRate);
  buffer.getChannelData(0).set(float32Samples);
  playbackQueue.push(buffer);
  if (!isPlaying) scheduleNext();
}

function scheduleNext() {
  if (playbackQueue.length === 0) {
    isPlaying = false;
    return;
  }
  isPlaying = true;
  const buffer = playbackQueue.shift();
  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  source.connect(audioCtx.destination);

  const now = audioCtx.currentTime;
  const startTime = Math.max(now, nextPlayTime);
  source.start(startTime);
  nextPlayTime = startTime + buffer.duration;

  source.onended = () => scheduleNext();
}

function flushPlayback() {
  playbackQueue = [];
  nextPlayTime = 0;
  isPlaying = false;
}

// ---- WebSocket + mic ----
async function connect() {
  ensureAudioCtx();

  // Build WS URL with query params.
  const loc = window.location;
  const proto = loc.protocol === 'https:' ? 'wss:' : 'ws:';
  const params = new URLSearchParams({
    asr_url: settings.asrUrl,
    llm_url: settings.llmUrl,
    llm_key: settings.llmKey,
    llm_model: settings.llmModel,
    voice: settings.voice,
    system_prompt: settings.systemPrompt,
  });
  const url = `${proto}//${loc.host}/ws/voice?${params}`;

  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';

  ws.onopen = async () => {
    isConnected = true;
    micBtn.classList.add('active');
    setPhase('idle');
    await startMic();
  };

  ws.onmessage = (event) => {
    if (event.data instanceof ArrayBuffer) {
      // Float32 PCM audio from TTS.
      const float32 = new Float32Array(event.data);
      queueAudio(float32);
      return;
    }
    // JSON text frame.
    try {
      const msg = JSON.parse(event.data);
      handleServerMessage(msg);
    } catch (e) {
      console.error('bad server message', e);
    }
  };

  ws.onclose = () => {
    isConnected = false;
    micBtn.classList.remove('active');
    setPhase('idle');
    stopMic();
  };

  ws.onerror = (err) => {
    console.error('WS error', err);
    addError('WebSocket connection failed');
  };
}

function disconnect() {
  if (ws) { ws.close(); ws = null; }
  stopMic();
  flushPlayback();
  isConnected = false;
  micBtn.classList.remove('active');
  setPhase('idle');
}

function handleServerMessage(msg) {
  switch (msg.type) {
    case 'init':
      outputSampleRate = msg.outputSampleRate || 24000;
      break;
    case 'state':
      setPhase(msg.phase);
      break;
    case 'asr':
      addMessage('user', msg.text);
      break;
    case 'llm_partial':
      updatePartial(msg.text);
      break;
    case 'interrupt':
      flushPlayback();
      removePartial();
      break;
    case 'done':
      // Finalize partial as a real message.
      if (partialEl) {
        const text = partialEl.textContent;
        removePartial();
        addMessage('assistant', text);
      }
      setPhase('idle');
      break;
    case 'error':
      addError(msg.message);
      setPhase('idle');
      break;
  }
}

async function startMic() {
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true, noiseSuppression: true }
    });

    const micCtx = new AudioContext({ sampleRate: mediaStream.getAudioTracks()[0].getSettings().sampleRate || 48000 });
    await micCtx.audioWorklet.addModule('/static/pcm-recorder-worklet.js');

    const source = micCtx.createMediaStreamSource(mediaStream);
    workletNode = new AudioWorkletNode(micCtx, 'pcm-recorder-processor', {
      processorOptions: { targetSampleRate: 16000 }
    });

    workletNode.port.onmessage = (event) => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        // event.data is an ArrayBuffer of int16 PCM.
        ws.send(event.data);
      }
    };

    source.connect(workletNode);
    workletNode.connect(micCtx.destination); // needed for processing, outputs silence
  } catch (e) {
    console.error('mic error', e);
    addError('Microphone access denied or unavailable');
  }
}

function stopMic() {
  if (workletNode) { workletNode.disconnect(); workletNode = null; }
  if (mediaStream) {
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }
}

// ---- Mic button: toggle ----
micBtn.onclick = () => {
  if (isConnected) {
    disconnect();
  } else {
    connect();
  }
};

</script>
</body>
</html>
